<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kiran's Daily Pulse · Pro Editorial Edition</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=Space+Grotesk:wght@500;700&display=swap');

:root {
  --bg: #06080f;
  --bg-2: #0b0f1a;
  --surface: #0f1320;
  --surface-card: rgba(16, 20, 34, 0.72);
  --surface-hover: rgba(28, 34, 56, 0.95);
  --border: rgba(255, 255, 255, 0.08);
  --border-light: rgba(255, 255, 255, 0.04);
  --txt: #f1f5f9;
  --muted: #64748b;
  --muted2: #94a3b8;

  --accent: #6366f1;
  --accent-2: #8b5cf6;
  --accent-3: #ec4899;
  --accent-soft: rgba(99, 102, 241, 0.16);
  --accent-border: rgba(99, 102, 241, 0.45);
  --accent-glow: 0 0 40px rgba(99, 102, 241, 0.35);

  --c-all: #6366f1;
  --c-world: #38bdf8;
  --c-india: #f59e0b;
  --c-electronics: #a78bfa;
  --c-tech: #22d3ee;
  --c-bangalore: #34d399;
  --c-cricket: #4ade80;
  --c-saved: #fbbf24;

  --r-sm: 10px;
  --r: 14px;
  --r-lg: 18px;
  --r-xl: 24px;
  --shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
  --shadow-lg: 0 30px 80px rgba(0, 0, 0, 0.75);
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; scroll-padding-top: 140px; }
body {
  font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  color: var(--txt);
  background: var(--bg);
  min-height: 100vh;
  overflow-x: clip;
  -webkit-font-smoothing: antialiased;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99, 102, 241, 0.18), transparent),
    radial-gradient(ellipse 60% 40% at 100% 100%, rgba(236, 72, 153, 0.12), transparent),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
  background-attachment: fixed;
}
body.drawer-open { overflow: hidden; }

.orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(120px);
  z-index: 0;
  pointer-events: none;
  opacity: 0.4;
  animation: floatOrb 18s ease-in-out infinite;
}
.orb-1 {
  width: 560px; height: 560px;
  background: radial-gradient(circle, rgba(99, 102, 241, 0.45), transparent 70%);
  top: -180px; left: -160px;
}
.orb-2 {
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(236, 72, 153, 0.35), transparent 70%);
  bottom: -160px; right: -140px;
  animation-delay: -9s;
}
@keyframes floatOrb {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(40px, -30px) scale(1.08); }
  66% { transform: translate(-30px, 40px) scale(0.95); }
}

/* subtle grid overlay */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size: 60px 60px;
  mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 30%, transparent 80%);
  -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 30%, transparent 80%);
  pointer-events: none;
  z-index: 0;
}

.page {
  position: relative;
  z-index: 1;
  max-width: 1320px;
  margin: 0 auto;
  padding: 24px 20px 110px;
}

.glass {
  background: var(--surface-card);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
}

/* ── HERO ── */
.hero {
  border-radius: var(--r-xl);
  padding: 28px 32px;
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg, rgba(20, 24, 44, 0.85) 0%, rgba(10, 12, 22, 0.95) 100%);
  border: 1px solid rgba(99, 102, 241, 0.25);
  animation: fadeInUp 0.6s var(--ease);
}
.hero::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, transparent, var(--accent), var(--accent-3), var(--accent), transparent);
  background-size: 200% 100%;
  animation: shimmerBar 4s linear infinite;
}
@keyframes shimmerBar { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

.hero-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 14px;
}
.brand-badge {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(236, 72, 153, 0.12));
  border: 1px solid rgba(99, 102, 241, 0.4);
  border-radius: 50px;
  padding: 7px 16px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: #fff;
  backdrop-filter: blur(10px);
}
.live-dot {
  width: 8px; height: 8px;
  background: #34d399;
  border-radius: 50%;
  box-shadow: 0 0 12px #34d399;
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.85); } }

.hero-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.pill-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border);
  border-radius: 50px;
  padding: 8px 16px;
  font-size: 12px;
  color: var(--txt);
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s var(--ease);
  backdrop-filter: blur(10px);
}
.pill-btn:hover { border-color: var(--accent); color: #fff; transform: translateY(-1px); box-shadow: var(--accent-glow); }
.pill-btn.ai-btn {
  background: linear-gradient(135deg, rgba(139, 92, 246, 0.25), rgba(236, 72, 153, 0.15));
  border-color: rgba(139, 92, 246, 0.5);
  color: #e9d5ff;
}
.pill-btn.ai-btn:hover { background: linear-gradient(135deg, #8b5cf6, #ec4899); color: #fff; }

.hero-title {
  font-family: 'Manrope', sans-serif;
  font-size: clamp(24px, 3.6vw, 34px);
  font-weight: 800;
  letter-spacing: -0.8px;
  background: linear-gradient(135deg, #fff 0%, #c7d2fe 50%, #f9a8d4 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  line-height: 1.2;
}
.hero-date {
  font-size: 13.5px;
  color: var(--muted2);
  margin-top: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.hero-date::before {
  content: '';
  width: 6px; height: 6px;
  background: var(--accent);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--accent);
}

/* ── CONTROLS DOCK ── */
.controls-dock {
  position: sticky;
  top: 12px;
  border-radius: var(--r-lg);
  padding: 16px 20px;
  margin-bottom: 20px;
  z-index: 100;
  background: rgba(12, 16, 30, 0.75);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  box-shadow: 0 20px 50px rgba(0,0,0,0.6);
  animation: fadeInUp 0.7s var(--ease) 0.1s both;
}

.cat-tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 14px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border-light);
}
.cat-tab {
  padding: 8px 16px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border);
  border-radius: 50px;
  color: var(--muted2);
  font-family: 'DM Sans', sans-serif;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s var(--ease);
  display: inline-flex;
  align-items: center;
  gap: 7px;
  position: relative;
  overflow: hidden;
}
.cat-dot { width: 8px; height: 8px; border-radius: 50%; transition: transform 0.25s; }
.cat-count {
  background: rgba(255, 255, 255, 0.08);
  padding: 2px 7px;
  border-radius: 20px;
  font-size: 10.5px;
  font-weight: 700;
  transition: background 0.25s;
}
.cat-tab:hover { border-color: rgba(255,255,255,0.25); color: #fff; transform: translateY(-1px); }
.cat-tab:hover .cat-dot { transform: scale(1.3); }
.cat-tab.active {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  border-color: transparent;
  color: #fff;
  font-weight: 700;
  box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
}
.cat-tab.active .cat-dot { background: #fff !important; transform: scale(1.1); }
.cat-tab.active .cat-count { background: rgba(255, 255, 255, 0.25); color: #fff; }

.filter-row {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
}
.time-pills {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
}
.time-pill {
  padding: 6px 14px;
  border-radius: 50px;
  font-size: 11.5px;
  font-weight: 600;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  color: var(--muted2);
  cursor: pointer;
  transition: all 0.2s var(--ease);
}
.time-pill:hover { color: #fff; border-color: rgba(255,255,255,0.2); transform: translateY(-1px); }
.time-pill.active {
  background: var(--accent-soft);
  border-color: var(--accent-border);
  color: #fff;
  font-weight: 700;
  box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
}

.search-wrap {
  position: relative;
  flex: 1;
  min-width: 220px;
  max-width: 400px;
}
.search-wrap input {
  width: 100%;
  padding: 10px 32px 10px 38px;
  background: rgba(0, 0, 0, 0.4);
  border: 1.5px solid var(--border);
  border-radius: var(--r-sm);
  color: var(--txt);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  outline: none;
  transition: all 0.25s var(--ease);
}
.search-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: rgba(0,0,0,0.55); }
.search-icon {
  position: absolute;
  left: 12px; top: 50%;
  transform: translateY(-50%);
  color: var(--muted2);
  pointer-events: none;
  transition: color 0.2s;
}
.search-wrap:focus-within .search-icon { color: var(--accent); }

/* ── AI BRIEFING ── */
.ai-briefing-panel {
  display: none;
  border-radius: var(--r-lg);
  padding: 22px 26px;
  margin-bottom: 20px;
  background: linear-gradient(135deg, rgba(139, 92, 246, 0.18), rgba(236, 72, 153, 0.08), rgba(15, 16, 26, 0.9));
  border: 1px solid rgba(139, 92, 246, 0.4);
  backdrop-filter: blur(20px);
  animation: fadeInUp 0.4s var(--ease);
}
.ai-briefing-panel.show { display: block; }
.ai-briefing-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.ai-briefing-title {
  font-family: 'Manrope', sans-serif;
  font-size: 13px;
  font-weight: 800;
  color: #e9d5ff;
  text-transform: uppercase;
  letter-spacing: 1px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.ai-briefing-title::before {
  content: '✨';
  font-size: 16px;
}
.ai-briefing-content {
  font-size: 14px;
  line-height: 1.7;
  color: #e2e8f0;
  white-space: pre-wrap;
}

/* ── NEWS GRID ── */
.news-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 18px;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(24px); }
  to { opacity: 1; transform: translateY(0); }
}

.news-card {
  border-radius: var(--r-lg);
  padding: 0;
  display: flex;
  flex-direction: column;
  cursor: pointer;
  transition: transform 0.3s var(--ease), border-color 0.3s, box-shadow 0.3s;
  position: relative;
  overflow: hidden;
  border: 1px solid var(--border);
  background: var(--surface-card);
  backdrop-filter: blur(20px);
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  animation: fadeInUp 0.5s var(--ease) both;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}
.news-card:hover {
  transform: translateY(-6px);
  border-color: var(--card-accent, var(--accent));
  box-shadow: 0 24px 50px rgba(0,0,0,0.7), 0 0 0 1px var(--card-accent, var(--accent)) inset;
}

.card-inner { padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }

.card-meta-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  font-size: 11px;
  font-weight: 700;
}
.source-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 50px;
  background: rgba(255, 255, 255, 0.06);
  color: var(--card-accent, var(--accent));
  text-transform: uppercase;
  letter-spacing: 0.6px;
  font-size: 10.5px;
  border: 1px solid rgba(255,255,255,0.08);
}
.time-badge { color: var(--muted2); font-weight: 600; font-size: 11px; }
.time-badge.breaking {
  color: #34d399;
  background: rgba(52, 211, 153, 0.14);
  padding: 3px 9px;
  border-radius: 50px;
  font-weight: 700;
}

.card-split-row {
  display: flex;
  gap: 14px;
  align-items: flex-start;
}
.card-text-col { flex: 1; min-width: 0; }
.news-headline {
  font-family: 'Manrope', sans-serif;
  font-size: 16.5px;
  font-weight: 700;
  line-height: 1.32;
  color: #fff;
  margin-bottom: 8px;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  transition: color 0.2s;
}
.news-card:hover .news-headline { color: var(--card-accent, var(--accent)); }
.news-snippet {
  font-size: 13px;
  color: var(--muted2);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-thumb-wrap {
  width: 118px;
  height: 100px;
  border-radius: 12px;
  overflow: hidden;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  position: relative;
}
.card-thumb-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.4s var(--ease);
}
.news-card:hover .card-thumb-img { transform: scale(1.08); }

.card-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 12px;
  border-top: 1px solid var(--border-light);
  margin-top: 4px;
}
.cat-chip {
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.04);
  color: var(--card-accent, var(--accent));
  border: 1px solid rgba(255,255,255,0.06);
}
.card-actions { display: flex; gap: 7px; align-items: center; }
.icon-btn {
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border);
  color: var(--muted2);
  border-radius: 9px;
  padding: 6px 12px;
  font-size: 11.5px;
  font-weight: 700;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.2s var(--ease);
}
.icon-btn:hover { color: #fff; border-color: var(--card-accent, var(--accent)); transform: translateY(-1px); }
.icon-btn.saved { color: #fbbf24; border-color: rgba(251, 191, 36, 0.5); background: rgba(251, 191, 36, 0.1); }

/* ── READER DRAWER ── */
.reader-backdrop {
  position: fixed;
  inset: 0;
  z-index: 99999;
  background: rgba(3, 4, 8, 0.75);
  backdrop-filter: blur(16px);
  display: none;
  justify-content: flex-end;
}
.reader-backdrop.show { display: flex; }

.reader-drawer {
  width: min(780px, 100vw);
  height: 100%;
  background: linear-gradient(180deg, #0d1020 0%, #080a14 100%);
  border-left: 1px solid rgba(255, 255, 255, 0.12);
  display: flex;
  flex-direction: column;
  box-shadow: -30px 0 100px rgba(0, 0, 0, 0.95);
  animation: slideIn 0.35s var(--ease);
}
@keyframes slideIn { from { transform: translateX(100%); opacity: 0.5; } to { transform: translateX(0); opacity: 1; } }

.reader-top-bar {
  padding: 18px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(15, 18, 32, 0.95);
  backdrop-filter: blur(20px);
}
.reader-source-meta { display: flex; align-items: center; gap: 10px; font-size: 12.5px; font-weight: 700; }
.reader-close-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: rgba(255, 255, 255, 0.06);
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: all 0.2s;
}
.reader-close-btn:hover { background: var(--accent); border-color: var(--accent); transform: rotate(90deg); }

.reader-scroll-body { padding: 28px 32px 60px; overflow-y: auto; flex: 1; }
.reader-hero-img {
  width: 100%;
  max-height: 400px;
  object-fit: cover;
  border-radius: var(--r-lg);
  margin-bottom: 24px;
  border: 1px solid var(--border);
  background: #111320;
  box-shadow: 0 20px 50px rgba(0,0,0,0.6);
}
.reader-headline {
  font-family: 'Manrope', sans-serif;
  font-size: clamp(22px, 3.2vw, 30px);
  font-weight: 800;
  line-height: 1.25;
  color: #fff;
  margin-bottom: 16px;
  letter-spacing: -0.5px;
}
.reader-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 24px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--border-light);
}
.reader-btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff;
  border: none;
  border-radius: var(--r-sm);
  padding: 11px 20px;
  font-size: 13px;
  font-weight: 800;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 6px 20px rgba(99, 102, 241, 0.35);
}
.reader-btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(99, 102, 241, 0.5); }
.reader-btn-ai {
  background: rgba(139, 92, 246, 0.15);
  border: 1px solid rgba(139, 92, 246, 0.4);
  color: #e9d5ff;
  border-radius: var(--r-sm);
  padding: 11px 18px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}
.reader-btn-ai:hover { background: rgba(139, 92, 246, 0.3); transform: translateY(-1px); }

.reader-ai-box {
  display: none;
  background: linear-gradient(135deg, rgba(139, 92, 246, 0.14), rgba(236, 72, 153, 0.06));
  border: 1px solid rgba(139, 92, 246, 0.35);
  border-radius: var(--r);
  padding: 18px 20px;
  margin-bottom: 22px;
  font-size: 14px;
  line-height: 1.7;
  color: #f1f5f9;
  white-space: pre-wrap;
  animation: fadeInUp 0.3s var(--ease);
}
.reader-ai-box.show { display: block; }
.reader-article-content { font-size: 16px; line-height: 1.8; color: #cbd5e1; }
.reader-article-content p { margin-bottom: 18px; }

.skeleton-card {
  height: 180px;
  border-radius: var(--r-lg);
  background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.07) 50%, rgba(255,255,255,0.03) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
}
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

.mobile-bottom-nav {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 9000;
  background: rgba(8, 10, 20, 0.92);
  backdrop-filter: blur(24px);
  border-top: 1px solid rgba(255, 255, 255, 0.1);
  padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
  justify-content: space-around;
}
.mob-nav-btn {
  background: none;
  border: none;

function escapeSvgText(str) {

}

}

function extractBestImage(item, rawHtml, category, sourceLabel) {

  if (item.enclosure && item.enclosure.link && /^https?:\/\//i.test(item.enclosure.link)) return item.enclosure.link;
  const imgMatch = String(rawHtml || '').match(/<img[^>]+(?:src|data-src)=["']([^"'>]+)["']/i);
  if (imgMatch && imgMatch[1] && /^https?:\/\//i.test(imgMatch[1])) {
    return imgMatch[1].replace(/&amp;/g, '&');
  }
  return makeFallbackSvgDataUri(category, sourceLabel);
}

function proxyImageUrl(url) {
  if (!url || !/^https?:\/\//i.test(url)) return url;
  // wsrv.nl image proxy bypasses hotlink protection & CORS
  return 'https://wsrv.nl/?url=' + encodeURIComponent(url) + '&w=260&h=200&fit=cover&output=jpg';

function fetchWithTimeout(url, ms) {
  const ctrl = new AbortController();
  const id = setTimeout(() => ctrl.abort(), ms);
  return fetch(url, { signal: ctrl.signal }).finally(() => clearTimeout(id));
}

function parseXmlStringToItems(xmlText, source) {
  const xmlDoc = new DOMParser().parseFromString(xmlText, 'text/xml');
  const nodes = [...xmlDoc.querySelectorAll('item, entry')];
  if (!nodes.length) throw new Error('No XML items');

  return nodes.slice(0, 12).map(node => {
    const mediaContent = node.getElementsByTagNameNS('*', 'content')[0] || node.getElementsByTagNameNS('*', 'thumbnail')[0];
    const enclosure = node.querySelector('enclosure');
    const thumbUrl = (mediaContent && mediaContent.getAttribute('url')) || (enclosure && enclosure.getAttribute('url')) || '';
    const desc = (node.querySelector('description, summary') && node.querySelector('description, summary').textContent) || '';
    const encodedNode = node.getElementsByTagNameNS('*', 'encoded')[0];
    const contentEncoded = (encodedNode && encodedNode.textContent) || desc;
    const linkNode = node.querySelector('link');
    const linkUrl = (linkNode && (linkNode.textContent.trim() || linkNode.getAttribute('href'))) || '#';

    return normalizeArticle({
      title: (node.querySelector('title') && node.querySelector('title').textContent) || '',
      link: linkUrl,
      pubDate: (node.querySelector('pubDate, published, updated') && node.querySelector('pubDate, published, updated').textContent) || '',
      description: desc,
      content: contentEncoded,
      thumbnail: thumbUrl
    }, source);
  });
}

async function fetchSingleFeed(source) {
  // 1. rss2json — reliable, CORS-friendly, returns structured JSON
  try {
    const res = await fetchWithTimeout(
      'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(source.url),
      9000
    );
    const data = await res.json();
    if (data && data.status === 'ok' && Array.isArray(data.items) && data.items.length) {
      return data.items.slice(0, 12).map(item => normalizeArticle({
        title: item.title,
        link: item.link,
        pubDate: item.pubDate,
        description: item.description,
        content: item.content,
        thumbnail: item.thumbnail || (item.enclosure && item.enclosure.link) || ''
      }, source));
    }
  } catch (err) {}

  return [];
}

function normalizeArticle(item, source) {

  const now = Date.now();
  const diffHours = Number.isNaN(pubDate.getTime())
    ? 6
    : Math.max(0.1, (now - pubDate.getTime()) / 3600000);

  let id;

    id = 'art_' + btoa(encodeURIComponent((item.link || cleanTitle).substring(0, 80))).replace(/[^a-zA-Z0-9]/g, '');
  } catch (e) {
    id = 'art_' + Math.random().toString(36).slice(2);
  }

  return {
    id,
    title: cleanTitle,
    link: item.link || '#',
    snippet: cleanText.length > 180 ? cleanText.substring(0, 177) + '…' : cleanText,
    fullHtml: sanitizeArticleHtml(rawBodyHtml, cleanText),
    fullPlainText: cleanText,
    imageUrl,
    fallbackSvg: makeFallbackSvgDataUri(source.category, source.label),
    sourceLabel: source.label,
    category: source.category,
    hoursOld: diffHours,
    timeLabel: formatAge(diffHours)
  };
}

function sanitizeArticleHtml(rawHtml, plainText) {
  if (!rawHtml || plainText.length < 40) {
    return `<p>${esc(plainText || 'Tap "Load Full Web Article" above to pull the complete story text directly into this reader.')}</p>`;
  }
  const doc = new DOMParser().parseFromString(rawHtml, 'text/html');
  doc.querySelectorAll('iframe, form, button').forEach(el => el.remove());
  const paragraphs = [...doc.querySelectorAll('p')].map(p => p.textContent.trim()).filter(t => t.length > 25);
  if (paragraphs.length >= 2) {
    return paragraphs.map(p => `<p>${esc(p)}</p>`).join('');
  }
  const sentences = plainText.split(/(?<=\.)\s+/);
  const chunks = [];
  for (let i = 0; i < sentences.length; i += 3) {
    chunks.push(`<p>${esc(sentences.slice(i, i + 3).join(' '))}</p>`);
  }
  return chunks.join('');
}

function formatAge(hours) {
  if (hours < 1) return `${Math.max(4, Math.round(hours * 60))}m ago`;
  if (hours < 24) return `${Math.round(hours)}h ago`;
  return `${Math.round(hours / 24)}d ago`;
}

function stripHtml(html) {
  const doc = new DOMParser().parseFromString(html || '', 'text/html');
  return doc.body.textContent || '';
}

/* ── LOAD FEEDS WITH GUARANTEED FALLBACK INJECTION ── */
async function fetchAllFeeds(forceRefresh) {
  const syncBtn = document.getElementById('syncStatusBtn');
  if (syncBtn) syncBtn.textContent = '⏳ Loading…';

  // Same-day cache: instant load, no repeats, no network
  const cached = (!forceRefresh) ? loadCachedNews() : null;
  if (cached && cached.length) {
    allArticles = cached;
    articleLookup = {};
    allArticles.forEach(a => { articleLookup[a.id] = a; });
    updateCounts();
    renderNews();
    if (syncBtn) syncBtn.textContent = '🟢 Cached (today)';
    return;
  }

  allArticles = [];
  articleLookup = {};
  seenTitleSet = loadSeenKeys();

  // Saved bookmarks (always shown)
  Object.values(savedArticlesMap).forEach(a => {
    if (!a.imageUrl || /^data:image\/svg/i.test(a.imageUrl)) a.imageUrl = makeFallbackSvgDataUri(a.category || 'all', a.sourceLabel || 'Saved');
    else if (/^https?:\/\//i.test(a.imageUrl)) a.imageUrl = proxyImageUrl(a.imageUrl);
    if (!a.fallbackSvg || /^data:image\/svg/i.test(a.fallbackSvg)) a.fallbackSvg = a.imageUrl;
    if (!allArticles.some(x => x.id === a.id)) {
      allArticles.push(a);
      articleLookup[a.id] = a;
    }
  });

  // Curated fallbacks (always shown, dedupe by id)
  GUARANTEED_FALLBACK_NEWS.forEach(a => {
    const key = titleKey(a.title);
    if (!a.imageUrl) a.imageUrl = makeFallbackSvgDataUri(a.category, a.sourceLabel);
    if (!a.fallbackSvg) a.fallbackSvg = a.imageUrl;
    if (!allArticles.some(x => x.id === a.id)) {
      allArticles.push(a);
      articleLookup[a.id] = a;
    }
  });

  updateCounts();
  renderNews();

  // Live RSS (sequential to respect rate limits)
  let liveAdded = 0;
  for (const src of FEED_SOURCES) {
    const items = await fetchSingleFeed(src);
    if (items && items.length) {
      items.forEach(a => {
        if (!a.title || a.hoursOld > 168) return;
        const key = titleKey(a.title);
        if (seenTitleSet.has(key)) return;          // no repeats across days
        if (allArticles.some(x => titleKey(x.title) === key)) return; // dedupe
        if (!a.imageUrl) a.imageUrl = makeFallbackSvgDataUri(a.category, a.sourceLabel);
        if (!a.fallbackSvg) a.fallbackSvg = a.imageUrl;
        allArticles.push(a);
        articleLookup[a.id] = a;
        liveAdded++;
      });
      allArticles.sort((a, b) => a.hoursOld - b.hoursOld);
      updateCounts();
      renderNews();
    }
    await new Promise(r => setTimeout(r, 1400));
  }

  // Guarantee content even if every live feed was filtered out
  if (allArticles.length < 6) {
    GUARANTEED_FALLBACK_NEWS.forEach(a => {
      if (!allArticles.some(x => x.id === a.id)) {
        if (!a.imageUrl) a.imageUrl = makeFallbackSvgDataUri(a.category, a.sourceLabel);
        if (!a.fallbackSvg) a.fallbackSvg = a.imageUrl;
        allArticles.push(a);
        articleLookup[a.id] = a;
      }
    });
    updateCounts();
    renderNews();
  }

  // Persist seen keys + cache for the rest of the day
  allArticles.forEach(a => seenTitleSet.add(titleKey(a.title)));
  saveSeenKeys(seenTitleSet);
  saveCachedNews(allArticles);

  const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  if (syncBtn) syncBtn.textContent = liveAdded ? `🟢 Live ${timeStr} (+${liveAdded})` : `🟢 Ready ${timeStr}`;
}

function updateCounts() {
  const pool = allArticles.filter(a => a.hoursOld <= maxAgeHours);
  const cats = ['world', 'india', 'electronics', 'tech', 'bangalore', 'cricket'];
  document.getElementById('cnt-all').textContent = pool.length;
  cats.forEach(c => {
    const el = document.getElementById(`cnt-${c}`);
    if (el) el.textContent = pool.filter(a => a.category === c).length;
  });
  document.getElementById('cnt-saved').textContent = Object.keys(savedArticlesMap).length;
}

function applyCategoryTheme(cat) {
  const cfg = CATEGORY_THEMES[cat] || CATEGORY_THEMES.all;
  document.documentElement.style.setProperty('--theme', cfg.color);
  document.documentElement.style.setProperty('--theme-Soft', cfg.soft);
  document.documentElement.style.setProperty('--theme-Border', cfg.border);
  document.getElementById('activeChannelBadge').textContent = `Kiran's Daily Pulse · ${cfg.icon} ${cfg.label}`;
}

function selectCategory(cat) {
  activeCategory = cat;
  applyCategoryTheme(cat);
  document.querySelectorAll('.cat-tab').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
  document.querySelectorAll('.mob-nav-btn').forEach(b => b.classList.toggle('active', b.dataset.mob === cat));
  renderNews();
}

function setTimeFilter(hours) {
  maxAgeHours = hours;
  document.querySelectorAll('.time-pill').forEach(p => p.classList.toggle('active', Number(p.dataset.hours) === hours));
  updateCounts();
  renderNews();
}

function renderNews() {
  const grid = document.getElementById('newsGrid');
  const q = document.getElementById('searchInput').value.toLowerCase().trim();

  let list = activeCategory === 'saved'
    ? Object.values(savedArticlesMap)
    : allArticles.filter(a => a.hoursOld <= maxAgeHours);

  if (activeCategory !== 'all' && activeCategory !== 'saved') {
    list = list.filter(a => a.category === activeCategory);
  }

  if (q) {
    list = list.filter(a =>
      a.title.toLowerCase().includes(q) ||
      a.snippet.toLowerCase().includes(q) ||
      a.sourceLabel.toLowerCase().includes(q)
    );
  }

  if (!list.length) {
    grid.innerHTML = `
      <div class="glass" style="grid-column:1/-1;text-align:center;padding:48px 20px;border-radius:var(--r-lg);color:var(--muted2)">
        <div style="font-size:28px;margin-bottom:8px">📡</div>
        <div style="font-family:'Manrope',sans-serif;font-size:17px;font-weight:700;color:#fff;margin-bottom:6px">No stories match this filter</div>
        <div style="font-size:13px;margin-bottom:14px">Try switching category tabs or clearing your search query.</div>
        <button class="pill-btn" onclick="selectCategory('all')">View Top Digest</button>
      </div>`;
    return;
  }

  grid.innerHTML = list.slice(0, 64).map((a, i) => {
    const isSaved = Boolean(savedArticlesMap[a.id]);
    const isBreaking = a.hoursOld <= 3;
    const catCfg = CATEGORY_THEMES[a.category] || CATEGORY_THEMES.all;
    const safeImage = a.imageUrl || makeFallbackSvgDataUri(a.category || 'all', a.sourceLabel || 'News');
    const safeFallback = a.fallbackSvg || safeImage;

    return `
      <article class="news-card glass" style="--card-accent: ${catCfg.color}; animation-delay: ${i * 45}ms" onclick="openReader('${a.id}')">
        <div>
          <div class="card-meta-top">
            <span class="source-pill">${esc(a.sourceLabel)}</span>
            <span class="time-badge ${isBreaking ? 'breaking' : ''}">${isBreaking ? '⚡ ' : ''}${esc(a.timeLabel)}</span>
          </div>
          <div class="card-split-row">
            <div class="card-text-col">
              <h3 class="news-headline">${esc(a.title)}</h3>
              <p class="news-snippet">${esc(a.snippet || 'Tap card to open full story in reader view.')}</p>
            </div>
            <div class="card-thumb-wrap">
              <img class="card-thumb-img" src="${esc(safeFallback)}" alt=""${safeImage && safeImage !== safeFallback ? ' data-real-src="' + esc(safeImage) + '"' : ''}>
            </div>
          </div>
        </div>
        <div class="card-footer">
          <span class="cat-chip">${catCfg.icon} ${esc(catCfg.label)}</span>
          <div class="card-actions" onclick="event.stopPropagation()">
            <button class="icon-btn ${isSaved ? 'saved' : ''}" onclick="toggleSaveArticle('${a.id}')">
              ${isSaved ? '★ Saved' : '☆ Save'}
            </button>
            <button class="icon-btn" onclick="openReader('${a.id}')">Read Story ▸</button>
          </div>
        </div>
      </article>
    `;
  }).join('');

  hydrateCardImages();
}

function hydrateCardImages() {
  document.querySelectorAll('.card-thumb-img[data-real-src]').forEach(img => {
    const real = img.dataset.realSrc;
    if (!real || real === img.getAttribute('src')) {
      img.removeAttribute('data-real-src');
      return;
    }
    const probe = new Image();
    probe.onload = () => { img.src = real; img.removeAttribute('data-real-src'); };
    probe.onerror = () => { img.removeAttribute('data-real-src'); };
    probe.src = real;
  });
}

/* ── FULL ARTICLE READER DRAWER LOGIC ── */
function openReader(articleId) {
  const a = articleLookup[articleId] || savedArticlesMap[articleId];
  if (!a) return;
  currentlyOpenArticle = a;

  const catCfg = CATEGORY_THEMES[a.category] || CATEGORY_THEMES.all;
  const sourcePill = document.getElementById('readerSourcePill');
  sourcePill.textContent = `${catCfg.icon} ${a.sourceLabel}`;
  sourcePill.style.color = catCfg.color;

  document.getElementById('readerTimeText').textContent = a.timeLabel;
  document.getElementById('readerTitle').textContent = a.title;

  const heroImg = document.getElementById('readerHeroImg');
  const safeFallback = a.fallbackSvg || makeFallbackSvgDataUri(a.category || 'all', a.sourceLabel || 'News');
  const safeImage = a.imageUrl || safeFallback;
  heroImg.src = safeFallback;
  if (safeImage && safeImage !== safeFallback) {
    const probe = new Image();
    probe.onload = () => { heroImg.src = safeImage; };
    probe.src = safeImage;
  }

  document.getElementById('readerOriginalLink').href = a.link;
  document.getElementById('readerOriginalLink').style.background = catCfg.color;

  document.getElementById('readerAiBox').classList.remove('show');
  document.getElementById('readerContentBody').innerHTML = a.fullHtml;
  document.getElementById('deepFetchBtn').textContent = '📖 Load Full Web Article';

  document.getElementById('readerBackdrop').classList.add('show');
  document.body.classList.add('drawer-open');
  try { history.pushState({ newsReader: true }, '', '#article'); } catch (e) {}
}

function closeReaderDom() {
  document.getElementById('readerBackdrop').classList.remove('show');
  document.body.classList.remove('drawer-open');
  currentlyOpenArticle = null;
}

function closeReader() {
  if (document.getElementById('readerBackdrop').classList.contains('show')) {
    try { history.back(); } catch (e) { closeReaderDom(); }
  }
}

function closeReaderOnBackdrop(e) {
  if (e.target.id === 'readerBackdrop') closeReader();
}

async function fetchDeepFullText() {
  if (!currentlyOpenArticle) return;
  const btn = document.getElementById('deepFetchBtn');
  const bodyEl = document.getElementById('readerContentBody');
  btn.textContent = '⏳ Loading full article…';
  btn.disabled = true;

  try {
    let text = '';
    // Try multiple proxies; keep the first that returns usable content
    const proxies = [
      async () => {
        const res = await fetchWithTimeout('https://r.jina.ai/' + currentlyOpenArticle.link, 12000);
        const t = await res.text();
        if (!res.ok || !t || t.length < 200) return '';
        if (/amazon-adsystem|1x1 image|access denied/i.test(t)) return '';
        return t;
      },
      async () => {
        const res = await fetchWithTimeout('https://api.allorigins.win/get?url=' + encodeURIComponent(currentlyOpenArticle.link), 8000);
        const data = await res.json();
        const t = data && data.contents ? data.contents : '';
        if (!t || t.length < 200) return '';
        return t;
      }
    ];
    for (const p of proxies) {
      try { const t = await p(); if (t) { text = t; break; } } catch (e) {}
    }
    if (!text) throw new Error('No content');

    // Parse markdown (jina) or HTML (allorigins)
    let paras = [];
    if (/<[a-z][\s\S]*>/i.test(text)) {
      const doc = new DOMParser().parseFromString(text, 'text/html');
      doc.querySelectorAll('nav, header, footer, aside, form, script, style').forEach(el => el.remove());
      paras = [...doc.querySelectorAll('article p, main p, .story-content p, .article-body p, p')]
        .map(p => p.textContent.trim())
        .filter(t => t.length > 45 && !/cookie|subscribe|newsletter|copyright/i.test(t));
    } else {
      const lines = text.split(/\n+/).map(l => l.trim()).filter(Boolean);
      let buf = [];
      for (const line of lines) {
        if (/^#{1,6}\s/.test(line) || /^[-*]\s/.test(line)) {
          if (buf.length) { paras.push(buf.join(' ')); buf = []; }
          const cleaned = line.replace(/^#{1,6}\s*/, '').replace(/^[-*]\s*/, '').trim();
          if (cleaned.length > 30) paras.push(cleaned);
        } else {
          buf.push(line);
        }
      }
      if (buf.length) paras.push(buf.join(' '));
    }

    const unique = [...new Set(paras)].filter(p => p.length > 40).slice(0, 24);

    if (unique.length >= 2) {
      const formatted = unique.map(p => `<p>${esc(p.replace(/\*\*(.+?)\*\*/g, '$1'))}</p>`).join('');
      bodyEl.innerHTML = formatted;
      currentlyOpenArticle.fullHtml = formatted;
      currentlyOpenArticle.fullPlainText = unique.join('\n\n');
      btn.textContent = '✓ Full Article Loaded';
    } else {
      btn.textContent = '↗ Open Source Link Above';
      const note = document.createElement('p');
      note.style.cssText = 'color:var(--muted2);font-size:13px;margin-top:8px;';
      note.textContent = 'The publisher blocks inline loading. Use "Open Original Source" above.';
      bodyEl.appendChild(note);
    }
  } catch (err) {
    btn.textContent = '↗ Open Source Link Above';
    const note = document.createElement('p');
    note.style.cssText = 'color:var(--muted2);font-size:13px;margin-top:8px;';
    note.textContent = 'Could not load the full article inline. Use "Open Original Source" above.';
    bodyEl.appendChild(note);
  } finally {
    btn.disabled = false;
  }
}

async function summarizeOpenArticle() {
  if (!currentlyOpenArticle) return;
  if (!GEMINI_API_KEY) {
    manageGeminiKey();
    if (!GEMINI_API_KEY) return;
  }
  const aiBox = document.getElementById('readerAiBox');
  aiBox.classList.add('show');
  aiBox.textContent = '✨ Gemini is extracting key takeaways & context…';

  const prompt = `Summarize this news article in 3 crisp bullet points and 1 sentence on "Why It Matters":
Title: ${currentlyOpenArticle.title}
Source: ${currentlyOpenArticle.sourceLabel}
Content: ${currentlyOpenArticle.fullPlainText || currentlyOpenArticle.snippet}`;

  try {
    const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=' + encodeURIComponent(GEMINI_API_KEY), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
    });
    const data = await res.json();
    aiBox.textContent = (data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts[0].text) || 'Could not generate takeaways.';
  } catch (e) {
    aiBox.textContent = 'Error connecting to Gemini API.';
  }
}

function toggleSaveArticle(articleId) {
  const a = articleLookup[articleId] || savedArticlesMap[articleId];
  if (!a) return;
  if (savedArticlesMap[articleId]) {
    delete savedArticlesMap[articleId];
  } else {
    savedArticlesMap[articleId] = a;
  }
  localStorage.setItem('kiran_news_saved_v4', JSON.stringify(savedArticlesMap));
  updateCounts();
  renderNews();
}

async function generateAiBriefing() {
  if (!GEMINI_API_KEY) {
    manageGeminiKey();
    if (!GEMINI_API_KEY) return;
  }
  const panel = document.getElementById('aiBriefingPanel');
  const txt = document.getElementById('aiBriefingText');
  panel.classList.add('show');
  txt.textContent = '⏳ Synthesizing top stories across World, India, Electronics, Bengaluru & Cricket…';

  const topHeadlines = allArticles.slice(0, 30).map(a => `[${a.category.toUpperCase()}] ${a.title}`).join('\n');
  const prompt = `Create a sharp 60-second morning briefing for Kiran (Product Development Engineer in Bengaluru) with 5 bullet points:
1. 🌍 World & 🇮🇳 India Lead Story
2. ⚡ Electronics & New Product Launches
3. 💻 Tech & AI
4. 📍 Bengaluru Local Update
5. 🏏 Cricket Update

Headlines:
${topHeadlines}`;

  try {
    const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=' + encodeURIComponent(GEMINI_API_KEY), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
    });
    const data = await res.json();
    txt.textContent = (data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts[0].text) || 'Unable to generate summary.';
  } catch (err) {
    txt.textContent = 'Error connecting to Gemini API. Check your key.';
  }
}

function esc(str) {
  return String(str || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeReader();
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
});

window.addEventListener('popstate', () => {
  if (document.getElementById('readerBackdrop').classList.contains('show')) {
    closeReaderDom();
  }
});

initDateBanner();
fetchAllFeeds();
